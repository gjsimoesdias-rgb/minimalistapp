name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: |
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk minimal.apk

      - uses: actions/upload-artifact@v7
        with:
          name: minimal-launcher
          path: minimal.apk

      # Stable download link: /releases/latest/download/minimal.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Minimal (latest build)
          body: "Built from ${{ github.sha }}. Download minimal.apk and open it on your phone."
          files: minimal.apk
          make_latest: true
